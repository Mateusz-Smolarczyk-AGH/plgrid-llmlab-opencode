services:
  cyfrocode:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cyfrocode:latest
    container_name: cyfrocode
    stdin_open: true
    tty: true
    user: 1000:1000
    volumes:
      - .:/workspace:z
      - ./data/opencode-config:/home/user/.config/opencode:z
      - ./data/opencode-data:/home/user/.local/share/opencode:z
      - ./data/macrodata:/home/user/.config/macrodata:z
      - ./data/wikis:/home/user/wikis:z
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/home/user/.Xauthority:ro
    environment:
      - HOME=/home/user
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/home/user/.Xauthority
    secrets:
      - cyfrocode_env
    working_dir: /workspace
    network_mode: host

secrets:
  cyfrocode_env:
    file: ./.env
